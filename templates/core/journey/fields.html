{{ form.non_field_errors }}
{% for field in form %}
<div class="field-group{% if field.name == 'note' %} field-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
</div>
{% endfor %}
